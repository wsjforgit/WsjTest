name: Build Delta Sensitivity Tester Windows EXE

on:
  push:
    branches:
      - delta-sensitivity-exe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win-x64:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Rebuild and extract source
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'delta-sensitivity-build/source.b64.*' | Sort-Object Name
          if (-not $parts -or $parts.Count -lt 7) { throw "source chunks missing: found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes('source-rebuilt.zip', $bytes)
          $zip = Get-Item 'source-rebuilt.zip'
          $zip | Format-List Name,Length,FullName
          if ($zip.Length -lt 30000) { throw "rebuilt source zip too small: $($zip.Length) bytes" }
          if (Test-Path buildsrc) { Remove-Item buildsrc -Recurse -Force }
          Expand-Archive -Path 'source-rebuilt.zip' -DestinationPath 'buildsrc' -Force
          if (-not (Test-Path 'buildsrc/DeltaSensitivityTester.csproj')) { throw 'project file missing after extraction' }
          Get-ChildItem buildsrc | Select-Object Name,Length

      - name: Restore
        shell: pwsh
        run: dotnet restore 'buildsrc/DeltaSensitivityTester.csproj'

      - name: Publish single-file Windows x64
        shell: pwsh
        run: |
          dotnet publish 'buildsrc/DeltaSensitivityTester.csproj' `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o 'buildsrc/publish'
          if (-not (Test-Path 'buildsrc/publish/DeltaSensitivityTester.exe')) {
            throw 'DeltaSensitivityTester.exe was not generated.'
          }
          Get-Item 'buildsrc/publish/DeltaSensitivityTester.exe' | Format-List Name,Length,FullName

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: DeltaSensitivityTester-win-x64-exe
          path: buildsrc/publish/DeltaSensitivityTester.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload full publish folder
        uses: actions/upload-artifact@v4
        with:
          name: DeltaSensitivityTester-win-x64-full
          path: buildsrc/publish/**
          if-no-files-found: error
          retention-days: 14
